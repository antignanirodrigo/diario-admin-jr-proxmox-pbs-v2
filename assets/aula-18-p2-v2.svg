<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Aula 18, tavola 2: avvio e prova limitata del servizio</title>
  <desc id="desc">CT 301 avviato, IP verificato, Nginx attivo e HTTP 200 dall’host; utenti remoti e recupero restano pendenti.</desc>
  <image x="0" y="0" width="1536" height="1024" xlink:href="aula-18-p2-base-v2.png"/>
  <g fill="#fffdf8" stroke="#0a1724" stroke-width="3.5" stroke-linejoin="round">
    <path d="M1161 786 L1136 694 L1222 777 Z"/><ellipse cx="1149" cy="817" rx="106" ry="45"/>
    <path d="M1404 791 L1396 691 L1472 779 Z"/><ellipse cx="1404" cy="817" rx="105" ry="45"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#081927" text-anchor="middle">
    <text x="1149" y="811"><tspan>HTTP 200.</tspan><tspan x="1149" dy="21">È pronto?</tspan></text>
    <text x="1404" y="811"><tspan>Solo da</tspan><tspan x="1404" dy="21">questo host.</tspan></text>
  </g>
  <g fill="#0a263e" stroke="#8fe3ff" stroke-width="2.5">
    <rect x="19" y="18" width="469" height="66" rx="11"/>
    <rect x="529" y="341" width="479" height="116" rx="11"/>
    <rect x="1050" y="403" width="469" height="69" rx="11"/>
    <rect x="18" y="927" width="477" height="78" rx="11"/>
    <rect x="546" y="920" width="470" height="86" rx="11"/>
    <rect x="1051" y="923" width="469" height="82" rx="11"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="254" y="43" font-size="14" fill="#7fe0ff">CICLO DI VITA</text>
    <text x="254" y="68" font-size="19">CT 301: running</text>
    <text x="1284" y="429" font-size="14" fill="#7fe0ff">INSTALLAZIONE NEL CT</text>
    <text x="1284" y="455" font-size="18">Nginx dopo apt-get update</text>
    <text x="257" y="950" font-size="14" fill="#7fe0ff">PROCESSO NEL CONTAINER</text>
    <text x="257" y="979" font-size="19">nginx: active</text>
    <text x="780" y="945" font-size="14" fill="#7fe0ff">PROVA pve02 → CT 301</text>
    <text x="780" y="975" font-size="19">HTTP/1.1 200 OK dall’host</text>
    <text x="1285" y="946" font-size="14" fill="#7fe0ff">FUORI DAL TEST</text>
    <text x="1285" y="978" font-size="17">Utenti remoti · backup · restore</text>
  </g>
  <g font-family="Consolas,monospace" font-size="20" fill="#eaf7ff" font-weight="700">
    <text x="549" y="377">pct exec 301 -- ip -br address</text>
    <text x="549" y="409">eth0  UP  10.10.10.31/24</text>
  </g>
</svg>

