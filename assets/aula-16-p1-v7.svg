<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Aula 16, tavola 1: distinguere template, clone, snapshot e backup</title>
  <desc id="desc">Sei quadri con scene differenti nel datacenter. La preparazione della base precede template e clone; lo snapshot locale non sostituisce il backup esterno ancora da eseguire.</desc>
  <image x="0" y="0" width="1536" height="1024" xlink:href="aula-16-p1-base-v3.png"/>
  <g fill="#fffdf8" stroke="#0a1724" stroke-width="3.5" stroke-linejoin="round">
    <path d="M247.6 87.1 A163 45 0 1 1 267.2 90.3 C251.7 97.8 212.5 113.9 193.8 118.4 C205.6 108.6 235.1 92.6 247.6 87.1 Z"/>
    <path d="M818.2 94.3 A189 46 0 1 1 842.4 91.7 C853.9 98.1 881.1 116.2 891.8 126.8 C872.9 121.2 833.6 102.7 818.2 94.3 Z"/>
    <path d="M1246.4 88.7 A172 46 0 1 1 1267 92 C1251.2 99.3 1211.4 114.7 1192.5 118.9 C1204.4 109.4 1233.9 94 1246.4 88.7 Z"/>
    <path d="M237 597.2 A174 46 0 1 1 258.6 600.2 C243.1 608.2 203.9 625.4 185.1 630.5 C196.5 620.2 224.9 603.2 237 597.2 Z"/>
    <path d="M1314.4 602.8 A189 46 0 1 1 1340.5 601.8 C1347.3 614.1 1361.7 645.5 1365.7 661.1 C1351.3 648.5 1324.4 616.5 1314.4 602.8 Z"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#081927" text-anchor="middle">
    <text x="340" y="44"><tspan>Uno snapshot ci salva</tspan><tspan x="340" dy="26">se perdiamo il nodo?</tspan></text>
    <text x="754" y="43"><tspan>Quattro strumenti,</tspan><tspan x="754" dy="26">quattro scopi diversi.</tspan></text>
    <text x="1345" y="43"><tspan>Base 230 attiva;</tspan><tspan x="1345" dy="26">rete virtuale isolata.</tspan></text>
    <text x="328" y="550"><tspan>Pulisco l'identità.</tspan><tspan x="328" dy="26">Poi arresto la base.</tspan></text>
    <text x="1298" y="549"><tspan>Il backup esterno</tspan><tspan x="1298" dy="26">è ancora da fare.</tspan></text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#fff" stroke="#071e30" stroke-width="5" paint-order="stroke">
    <text x="652" y="218">TEMPLATE</text><text x="838" y="218">BACKUP</text>
    <text x="648" y="414">CLONE</text><text x="838" y="414">SNAPSHOT</text>
  </g>
  <rect x="551" y="510" width="431" height="83" rx="12" fill="#0a263e" stroke="#8fe3ff" stroke-width="2.5"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fff" text-anchor="middle">
    <text x="766" y="533" font-size="14" font-weight="800" fill="#7fe0ff">NOTA TECNICA</text>
    <text x="766" y="557" font-size="19" font-weight="600"><tspan>Il clone avrà un disco proprio,</tspan><tspan x="766" dy="23">ma resta sul nodo locale.</tspan></text>
  </g>
</svg>
