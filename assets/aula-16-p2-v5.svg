<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Aula 16, tavola 2: verifica locale e attività ancora aperte</title>
  <desc id="desc">Sei quadri mostrano la base 230, pulizia dell'identità, template, clone QA isolato, snapshot locale e le verifiche ancora pendenti.</desc>
  <image x="0" y="0" width="1536" height="1024" xlink:href="aula-16-p2-base-v3.png"/>
  <g fill="#fffdf8" stroke="#0a1724" stroke-width="3.5" stroke-linejoin="round">
    <path d="M154 77 L94 161 L250 90 Z"/><ellipse cx="327" cy="50" rx="174" ry="46"/>
    <path d="M874 76 L905 148 L825 91 Z"/><ellipse cx="749" cy="50" rx="192" ry="46"/>
    <path d="M306 584 L265 673 L378 596 Z"/><ellipse cx="274" cy="557" rx="219" ry="47"/>
    <path d="M1200 584 L1185 682 L1263 595 Z"/><ellipse cx="1311" cy="557" rx="183" ry="47"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#081927" text-anchor="middle">
    <text x="327" y="44"><tspan>Base 230: running.</tspan><tspan x="327" dy="25">560G liberi prima del clone.</tspan></text>
    <text x="749" y="43"><tspan>Identità pulita.</tspan><tspan x="749" dy="25">Ora shutdown: stopped.</tspan></text>
    <text x="274" y="550"><tspan>Avvio QA isolato:</tspan><tspan x="274" dy="25">link_down=1.</tspan></text>
    <text x="1311" y="549"><tspan>Backup e identità guest:</tspan><tspan x="1311" dy="25">verifiche ancora aperte.</tspan></text>
  </g>
  <g fill="#0a263e" stroke="#8fe3ff" stroke-width="2.5">
    <rect x="1064" y="8" width="438" height="84" rx="12"/>
    <rect x="551" y="509" width="444" height="84" rx="12"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fff" text-anchor="middle">
    <text x="1283" y="31" font-size="14" font-weight="800" fill="#7fe0ff">SEQUENZA LOCALE</text>
    <text x="1283" y="54" font-size="19" font-weight="600"><tspan>Template 230, poi</tspan><tspan x="1283" dy="23">clone completo 231.</tspan></text>
    <text x="773" y="532" font-size="14" font-weight="800" fill="#7fe0ff">NOTA TECNICA</text>
    <text x="773" y="555" font-size="19" font-weight="600"><tspan>Snapshot pre-update locale,</tspan><tspan x="773" dy="23">senza RAM e senza backup.</tspan></text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#fff" stroke="#0a1d2b" stroke-width="5" paint-order="stroke" text-anchor="middle">
    <text x="1263" y="160">BASE 230</text><text x="1263" y="305">TEMPLATE 230</text><text x="1263" y="444">CLONE 231</text>
  </g>
</svg>
